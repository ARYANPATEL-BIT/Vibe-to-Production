version: 2
updates:
  - package-ecosystem: npm
    directory: /template
    schedule:
      interval: weekly
    # Wait 7 days before proposing a new release; security updates skip this wait.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days before proposing a new release; security updates skip this wait.
    cooldown:
      default-days: 7
