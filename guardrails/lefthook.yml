# Git hooks: run on your machine before code leaves it.
# Install once per clone: npm install -D lefthook secretlint @secretlint/secretlint-rule-preset-recommend && npx lefthook install

pre-commit:
  parallel: true
  jobs:
    - name: block secrets
      run: npx secretlint {staged_files}

    - name: block env files
      glob: ".env*"
      exclude: [".env.example"]
      run: echo 'Refusing to commit {staged_files}. Real secrets never go in git.' && exit 1

    - name: lint staged files
      glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
      run: npx eslint {staged_files}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: npm run typecheck

    - name: unit tests
      run: npm test
